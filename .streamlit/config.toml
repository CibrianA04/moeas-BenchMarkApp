# ============================================================================
#  Tema de la app (colores y tipografia).
# ============================================================================

[theme]
base = "dark"
primaryColor = "#2e8fff"
backgroundColor = "#0e162a"           # Azul noche profundo
secondaryBackgroundColor = "#1d263f"  # Sidebar que contrasta de forma natural
textColor = "#f1f5f9"                 # Texto claro con un levísimo tinte frío
font = "sans serif" 